<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="192x192" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://juanpablogomezesc-glitch.github.io/P-gina-web-/iconos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Mi progreso">
  <title>Mi progreso · Juan Pablo Gómez</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Las fuentes no frenan la página: se cargan en paralelo y se aplican cuando llegan -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="styles.css?v=90e35148">
  <link rel="stylesheet" href="progreso/progreso.css?v=3ba146bf">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header class="nav">
    <a href="index.html" class="logo">JP<span>·</span><span class="logo-largo">Entrenamiento</span></a>
    <nav>
      <a href="index.html#articulos" class="nav-cta">Artículos</a>
      <a href="index.html#contacto" class="nav-cta">Contacto</a>
    </nav>
  </header>

  <main id="contenido" class="progreso">
    <p class="aviso-prueba" id="aviso-demo">Vista de ejemplo: los números son de prueba, no son de ningún alumno.</p>
    <span class="etiqueta">Mi progreso</span>
    <h1 id="titulo">Tu evolución</h1>
    <p class="nota" id="estado-carga" role="status" hidden></p>
    <div class="pr-estado" id="pr-estado" hidden>
      <span id="actualizado" aria-live="polite"></span>
      <button type="button" id="btn-actualizar">Actualizar</button>
    </div>

    <div class="pr-acciones" id="pr-acciones">
      <a class="pastilla" id="btn-rutina" href="#" target="_blank" rel="noopener noreferrer" hidden>Mi rutina</a>
      <a class="pastilla" href="turnos.html">Turnos</a>
    </div>

    <section class="pr-resumen" id="pr-resumen" aria-label="Resumen"></section>
    <section class="pr-mensaje" id="pr-mensaje" aria-live="polite" hidden></section>

    <h2>Días entrenados</h2>
    <section id="dias-entrenados" class="pr-dias"></section>

    <h2 id="h-dias-semana" hidden>Tus días de la rutina</h2>
    <section id="dias-semana" class="pr-semana-dias" aria-live="polite" hidden></section>

    <div class="pr-controles">
      <div class="campo-peso">
        <label for="peso">Tu peso corporal (kg)</label>
        <input id="peso" type="text" inputmode="decimal" maxlength="6" placeholder="Ej: 75,5" autocomplete="off">
        <p class="nota" id="peso-nota">Escribilo para ver tu fuerza relativa. Queda guardado en este dispositivo.</p>
      </div>
      <div class="selector-ejercicio" id="selector-ejercicio" hidden>
        <div class="selectores">
          <label>Grupo <select id="sel-grupo"></select></label>
          <label>Ejercicio <select id="sel-ejercicio"></select></label>
        </div>
      </div>
    </div>

    <div class="filtros" role="group" aria-label="Período">
      <button type="button" data-semanas="8" aria-pressed="false">8 semanas</button>
      <button type="button" data-semanas="26" aria-pressed="false">6 meses</button>
      <button type="button" data-semanas="0" aria-pressed="true">Todo</button>
    </div>

    <section id="detalle" aria-live="polite"></section>

    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  </main>

  <script src="progreso/calculos.js?v=98c5e4dd"></script>
  <script src="progreso/progreso.js?v=10439769"></script>
</body>
</html>
